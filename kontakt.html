<!DOCTYPE html>
<html lang = "bs">
    <head>
        <meta charset="utf-8">
        <meta name = "viewport" content="width=device-width, initial-scale = 1.0">
        <title>HomeStyle | Narudzbe i Kontakt</title>
        <link rel="stylesheet" href="css/tptpstil.css">


    </head>
    <body>
        <!------------------------------------Stavke za korpu------------------------------------------------->
        <div class="mali-kontejner">
            <table>
                <tr>
                    <th>
                        <div class="korpa-info">
                            <img src="images/nesto" alt="slika-produkta">
                        </div>
                        <div>
                            <p>ImeProdukta</p>
                            <small>Cijena: nekaCijena</small>
                            <br>
                            <a href="">Ukloni</a>
                        </div>
                    </th>
                    <th>Kolicina</th>
                    <th>Cijena</th>
                </tr>
                <tr>
                    <td>Ime produkta</td>
                    <td><input type = "number" value="1"></td>
                    <td>200.00KM</td>
                </tr>
            </table>

            <div class="Ukupna-cijena">
            <table>
                <tr>
                    <td>Ukupno za platiti</td>
                </tr>
            </table>
            </div>
        </div>
<!----------------------------------------------Kontakt forma----------------------------------------------------------------->
<section class="hero">
    <p class="hero-label">Web shop namještaja</p>
    <h1>Kontakt</h1>
    <p class="hero-opis">Imate pitanja? Popunite formu i odgovoriti ćemo vam u što kraćem roku!</p>
</section>
<section class="Kontakt-sekcija">
    <form id="Kontakt-forma" novalidate>
        <div class="polje">
            <label for="Ime">Ime</label>
            <input type="text" id="Ime" name="Ime">
            <span class="Greška" id="Ime-Greška"></span>
        </div>
        <div class="polje">
            <label for="Prezime">Prezime</label>
            <input type="text" id="Prezime" name="Prezime">
            <span class="Greška" id="Prezime-Greška"></span>
        </div>
        <div class="polje">
            <label for="email">Email</label>
            <input type="text" id="email" name="email">
            <span class="Greška" id="email-Greška"></span>
        </div>
        <div class="polje">
            <label for="telefon">Telefon</label>
            <input type="text" id="telefon" name="telefon">
            <span class="Greška" id="telefon-Greška"></span>
        </div>
        <div class="polje">
            <label for="tema">Tema upita</label>
            <select id="tema" name="tema">
                <option value="">--Izaberite opciju--</option>
                <option value="informacije">Opće informacije</option>
                <option value="reklamacija">Reklamacija</option>
                <option value="narudzbe">Narudžbe</option>
                <option value="dostava">Dostava</option>
            </select>
            <span class="Greška" id="tema-Greška"></span>
        </div>
        <div class="polje">
            <label for="poruka">Poruka</label>
            <textarea id="poruka" name="poruka" rows="5"></textarea>
            <span class="Greška" id="poruka-Greška"></span>
        </div>
        <div class="dugme">
            <button type="submit">Pošalji</button>
            <button type="reset" id="reset-dugme">Poništi</button>
        </div>
    </form>
    <!--klase su napisane prema preporuci Claude ai-a, razumijem da 'label for' povezuje tekst tabele sa odredenim inputom
    'id' je jedinstveni identifikator za element na stranici, 'name' je ime polje koje se salje na server-->
    <div class="uspjesna-poruka" id="uspjesna-poruka" style="display: none;"></div>
</section>


<script src="tptpskripte.js"></script>
    </body>
</html>
